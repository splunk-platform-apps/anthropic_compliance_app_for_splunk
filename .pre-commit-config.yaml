# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
        files: ^package/.*\.(py|js|xml|json|sh|bash)$
        exclude: ^package/appserver/static/visualizations/[^/]+/[^/]+\.js$
    -   id: check-yaml
    -   id: check-added-large-files
        exclude: ^package/appserver/static/visualizations/[^/]+/[^/]+\.js$
    -   id: check-json
        types: [text]
        files: \.(json|manifest)$
    -   id: check-xml
    -   id: debug-statements
        files: ^package/(bin/|appserver/static/).*\.js$
    -   id: check-merge-conflict

    # Python linting and formatting
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.17.3'
    hooks:
    # Run the linter.
    -   id: ruff-check
    # Run the formatter.
    -   id: ruff-format

    # Javascript/Typescript linting
-   repo: https://github.com/eslint/eslint
    rev: v8.57.1
    hooks:
    -   id: eslint
        files: ^package/appserver/static/.*\.[jt]sx?$
        exclude: |
          (?x)^(
            package/appserver/static/visualizations/[^/]+/webpack.config.js$|
            package/appserver/static/visualizations/[^/]+/[^/]+\.js$|
            ^package/appserver/static/.*\.min\.(js|css)$|
            package/appserver/static/build/$
          )
        types: [file]
        args: ['--fix']
        additional_dependencies:
        -   "@typescript-eslint/parser"
        -   "@typescript-eslint/eslint-plugin"

    # Shell linting and formatting
-   repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
    -   id: shellcheck

    # Check code for security issues, bugs, and bad patterns
-   repo: https://github.com/returntocorp/semgrep
    rev: v1.182.0
    hooks:
    -   id: semgrep

    # Scan code to prevent committing secrets into the repo
-   repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
    -   id: detect-secrets
        args: ['--no-verify']
        exclude: |
          (?x)^(
            package/appserver/static/visualizations/[^/]+/[^/]+\.js$|
            ^package/appserver/static/.*\.min\.(js|css)$|
            README.md$
          )
