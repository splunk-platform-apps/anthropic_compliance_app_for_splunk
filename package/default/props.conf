## Search-time parsing and CIM field normalization for Anthropic Claude
## Enterprise sourcetypes. All events are single-line JSON emitted by the
## add-on's modular inputs, which set the event timestamp explicitly; the
## TIME_* settings below are a parsing fallback only.

[anthropic:compliance:activity]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 65536
TIME_PREFIX = \"created_at\"\s*:\s*\"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 32
TZ = UTC
KV_MODE = json
FIELDALIAS-claude_activity_user = actor_email ASNEW user
FIELDALIAS-claude_activity_src_user = actor_email ASNEW src_user
FIELDALIAS-claude_activity_src = actor_ip_address ASNEW src
FIELDALIAS-claude_activity_http_user_agent = actor_user_agent ASNEW http_user_agent
EVAL-app = "claude_enterprise"
EVAL-vendor_product = "Anthropic Claude Enterprise"
EVAL-dest = "claude.ai"
EVAL-action = case(like(event_type, "%_failed"), "failure", like(event_type, "user_signed_in%") OR like(event_type, "%login%") OR like(event_type, "%logged_in%") OR like(event_type, "user_authenticated%"), "success", event_type == "user_signed_out" OR like(event_type, "%logout%") OR like(event_type, "%logged_out%"), "logoff", like(event_type, "%_viewed") OR like(event_type, "%_accessed"), "read", like(event_type, "%_created") OR like(event_type, "%_sent") OR like(event_type, "%_add_initiated") OR like(event_type, "%_uploaded") OR like(event_type, "%_published") OR like(event_type, "%_connected"), "created", like(event_type, "%_deleted"), "deleted", like(event_type, "%_renamed") OR like(event_type, "%_changed") OR like(event_type, "%_toggled") OR like(event_type, "%_verified") OR like(event_type, "%_activated") OR like(event_type, "%_deactivated") OR like(event_type, "%_updated"), "modified", true(), "unknown")
EVAL-authentication_method = case(event_type == "user_signed_in_sso", "sso", event_type == "user_signed_in_google", "google", event_type == "user_signed_in_apple", "apple", event_type == "user_signed_in_magic_link", "magic_link", event_type == "user_signed_in_phone_code", "phone_code")
EVAL-object = coalesce(claude_project_id, claude_chat_id, file_id, organization_id)
EVAL-object_category = case(isnotnull(claude_project_id), "project", isnotnull(claude_chat_id), "conversation", isnotnull(file_id), "file", true(), "organization")
EVAL-change_type = case(like(event_type, "org_sso%") OR like(event_type, "org_jit%") OR like(event_type, "org_domain%") OR like(event_type, "org_user%"), "AAA", true(), "application")
EVAL-status = "success"

