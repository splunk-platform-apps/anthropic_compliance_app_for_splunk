[anthropic_claude_auth_events]
search = (sourcetype="anthropic:compliance:activity" (event_type="user_signed_in*" OR event_type="user_signed_out" OR event_type="*login*" OR event_type="*logout*" OR event_type="*logged_in*" OR event_type="user_authenticated*" OR event_type="*_access_failed"))

[anthropic_claude_change_events]
search = (sourcetype="anthropic:compliance:activity" (event_type="org_*" OR event_type="project_*" OR event_type="conversation_*" OR event_type="*_created" OR event_type="*_updated" OR event_type="*_deleted" OR event_type="*_uploaded" OR event_type="*_published"))

[anthropic_claude_file_events]
search = (sourcetype="anthropic:compliance:activity" (event_type="claude_file_*" OR event_type="file_uploaded"))

[anthropic_claude_usage_events]
search = (sourcetype="anthropic:analytics:*")
