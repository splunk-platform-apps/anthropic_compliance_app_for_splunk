## All searches ship disabled and unscheduled. Enable and schedule the ones
## you need after configuring inputs. `claude_index` defaults to index=* and
## can be scoped to your Claude index via Settings > Advanced search > Search macros.

[Anthropic Claude - Multiple sign-in IPs for same user]
action.email = 0
alert.track = 0
cron_schedule = 0 */6 * * *
description = Detects users active in Claude Enterprise from more than two distinct IP addresses within 24 hours.
dispatch.earliest_time = -24h
dispatch.latest_time = now
disabled = 1
enableSched = 0
search = `claude_index` sourcetype="anthropic:compliance:activity" NOT actor_type="api_actor" \
| eval actor_email=coalesce(actor_email, entity_email, target_email) \
| where isnotnull(actor_email) \
| stats dc(actor_ip_address) AS ip_count values(actor_ip_address) AS ips by actor_email \
| where ip_count > 2

[Anthropic Claude - Access failures]
action.email = 0
alert.track = 0
cron_schedule = 15 * * * *
description = Alerts on access-denied events (for example claude_chat_access_failed), which may indicate probing of restricted chats or projects.
dispatch.earliest_time = -1h
dispatch.latest_time = now
disabled = 1
enableSched = 0
search = `claude_index` sourcetype="anthropic:compliance:activity" (event_type=*_access_failed OR event_type=*_failed) \
| eval actor_email=coalesce(actor_email, entity_email, target_email) \
| table _time, event_type, actor_email, actor_ip_address, claude_chat_id, claude_project_id

[Anthropic Claude - SSO configuration change]
action.email = 0
alert.track = 0
cron_schedule = 0 * * * *
description = Alerts on SSO or JIT provisioning configuration changes in the Claude Enterprise organization.
dispatch.earliest_time = -1h
dispatch.latest_time = now
disabled = 1
enableSched = 0
search = `claude_index` sourcetype="anthropic:compliance:activity" (event_type="org_sso_*" OR event_type="org_jit_toggled") \
| table _time, event_type, actor_email, actor_ip_address, organization_id

[Anthropic Claude - Data export started]
action.email = 0
alert.track = 0
cron_schedule = 0 * * * *
description = Alerts when an organization-wide data export is started in Claude Enterprise.
dispatch.earliest_time = -1h
dispatch.latest_time = now
disabled = 1
enableSched = 0
search = `claude_index` sourcetype="anthropic:compliance:activity" event_type="org_data_export_started" \
| table _time, event_type, actor_email, actor_ip_address, organization_id

[Anthropic Claude - Top cost users daily]
action.email = 0
alert.track = 0
cron_schedule = 0 8 * * *
description = Daily report of the top 20 Claude Enterprise users by spend over the trailing 7 days.
dispatch.earliest_time = -7d
dispatch.latest_time = now
disabled = 1
enableSched = 0
search = `claude_index` sourcetype="anthropic:analytics:user_cost" \
| stats sum(cost_usd) AS total_cost_usd by email \
| eval total_cost_usd=round(total_cost_usd, 2) \
| sort - total_cost_usd \
| head 20

[Anthropic Claude - Users near spend limit]
action.email = 0
alert.track = 0
cron_schedule = 0 9 * * *
description = Daily report of users at or above 80 percent of their Claude Enterprise spend limit.
dispatch.earliest_time = -7d
dispatch.latest_time = now
disabled = 1
enableSched = 0
search = `claude_index` sourcetype="anthropic:analytics:spend_limit" \
| stats latest(period_spend_usd) AS period_spend_usd latest(spend_limit_usd) AS spend_limit_usd latest(utilization_pct) AS utilization_pct by email \
| where utilization_pct >= 80 \
| sort - utilization_pct
