[claude_index]
definition = index=*
iseval = 0

[claude_signin_filter]
definition = (event_type=user_signed_in* OR event_type=*login* OR event_type=*logged_in* OR event_type=user_authenticated* OR event_type=*signin*)
iseval = 0

[claude_admin_filter]
definition = (event_type=org_sso_* OR event_type=org_jit_* OR event_type=org_domain_* OR event_type=org_user_deleted OR event_type=admin_api_key_* OR event_type=api_key_* OR event_type=*_role_updated OR event_type=*spend_limit* OR event_type=claude_code_user_settings_updated OR event_type=*integration*)
iseval = 0

[claude_export_filter]
definition = event_type IN ("org_data_export_started","org_data_export_completed")
iseval = 0

[claude_invite_filter]
definition = event_type IN ("org_user_invite_sent","org_user_invite_accepted","org_user_invite_rejected","org_user_invite_deleted","org_user_invite_re_sent")
iseval = 0

[claude_project_filter]
definition = (event_type=project_* OR event_type=conversation_* OR event_type=claude_chat_* OR event_type=claude_artifact_* OR event_type=platform_memory_*)
iseval = 0

[claude_file_filter]
definition = (event_type=claude_file_* OR event_type=file_uploaded)
iseval = 0

[claude_actor_email]
definition = eval actor_email=coalesce(actor_email, entity_email, target_email)
iseval = 0
